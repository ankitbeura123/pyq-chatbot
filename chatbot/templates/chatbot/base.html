<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Observatory — KIIT PYQ{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<style>
  :root{
    --void: #05070E;
    --starlight: #E7ECFA;
    --dim: rgba(226,231,245,0.5);
    --gold: #E4B667;
    --violet: #9C8CF0;
    --cyan: #6FD3D9;
    --glass: rgba(18,22,38,0.42);
    --glass-edge: rgba(226,231,245,0.14);
    --radius: 18px;

    --border: var(--glass-edge);
    --border-subtle: rgba(226,231,245,0.08);
    --bg: var(--glass);
    --bg-soft: rgba(255,255,255,0.04);
    --text: var(--starlight);
    --text-soft: var(--dim);
    --green: var(--cyan);
    --green-soft: rgba(111,211,217,0.12);
    --blue-soft: rgba(156,140,240,0.12);
    --blue-text: var(--violet);
    --amber-soft: rgba(228,182,103,0.12);
    --amber-text: var(--gold);
    --purple-soft: rgba(156,140,240,0.12);
    --purple-text: var(--violet);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--void); color: var(--starlight); font-family: 'Space Mono', monospace; }

  canvas#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .planet { position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; filter: blur(1px); }
  .planet.p1 { width: 540px; height: 540px; right: -180px; top: -200px; background: radial-gradient(circle at 35% 30%, rgba(156,140,240,0.5), rgba(156,140,240,0.05) 60%, transparent 75%); animation: driftA 40s ease-in-out infinite; }
  .planet.p2 { width: 420px; height: 420px; left: -160px; bottom: -180px; background: radial-gradient(circle at 60% 40%, rgba(228,182,103,0.35), rgba(228,182,103,0.04) 60%, transparent 75%); animation: driftB 55s ease-in-out infinite; }
  @keyframes driftA { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-30px,40px);} }
  @keyframes driftB { 0%,100%{transform:translate(0,0);} 50%{transform:translate(25px,-35px);} }

  .topbar-wrap { position: relative; z-index: 2; padding: 22px 26px 0; }
  .topbar {
    max-width: 900px; margin: 0 auto;
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--glass-edge);
    border-radius: 16px;
    padding: 12px 20px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
  .orbit-mark { width: 26px; height: 26px; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand-text { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--starlight); letter-spacing: 0.02em; }
  .brand-text span { color: var(--gold); }

  .topbar nav { display: flex; gap: 4px; flex: 1; }
  .topbar nav a {
    font-family: 'Space Mono', monospace;
    color: var(--dim); text-decoration: none;
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 10px;
    transition: background 0.2s, color 0.2s;
  }
  .topbar nav a:hover { color: var(--starlight); background: rgba(255,255,255,0.05); }
  .topbar nav a.active { color: var(--void); background: var(--cyan); font-weight: 700; }

  .page { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

  .card { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: var(--radius); backdrop-filter: blur(20px); }
  a.plain { color: inherit; text-decoration: none; }

  .tag { display: inline-block; font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; }
  .tag.green { background: var(--green-soft); color: var(--cyan); border: 1px solid rgba(111,211,217,0.3); }
  .tag.blue { background: var(--blue-soft); color: var(--violet); border: 1px solid rgba(156,140,240,0.3); }
  .tag.amber, .tag.purple { background: var(--amber-soft); color: var(--gold); border: 1px solid rgba(228,182,103,0.3); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.03em;
    padding: 9px 15px; border-radius: 10px;
    border: 1px solid var(--glass-edge); background: rgba(255,255,255,0.04); color: var(--starlight);
    cursor: pointer; text-decoration: none; transition: background 0.2s, border-color 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.08); }
  .btn-primary { border-color: var(--violet); background: rgba(156,140,240,0.15); color: var(--violet); }
  .btn-primary:hover { background: rgba(156,140,240,0.28); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(226,231,245,0.16); border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) { .planet, .orbit-mark { animation: none !important; } }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<canvas id="stars"></canvas>
<div class="planet p1"></div>
<div class="planet p2"></div>

<div class="topbar-wrap">
  <div class="topbar">
    <a href="{% url 'chat_page' %}" class="brand">
      <svg class="orbit-mark" viewBox="0 0 44 44" fill="none">
        <circle cx="22" cy="22" r="3" fill="#E4B667"/>
        <ellipse cx="22" cy="22" rx="20" ry="8" stroke="rgba(226,231,245,0.35)" stroke-width="0.8" transform="rotate(-20 22 22)"/>
        <ellipse cx="22" cy="22" rx="20" ry="8" stroke="rgba(156,140,240,0.35)" stroke-width="0.8" transform="rotate(35 22 22)"/>
        <circle cx="37" cy="16" r="1.6" fill="#6FD3D9"/>
      </svg>
      <span class="brand-text">Observatory <span>PYQ</span></span>
    </a>
<nav>
  <a href="{% url 'chat_page' %}" class="{% if request.resolver_match.url_name == 'chat_page' %}active{% endif %}">Chat</a>
  <a href="{% url 'browse_subjects' %}" class="{% if 'browse' in request.resolver_match.url_name %}active{% endif %}">Browse</a>
  <a href="{% url 'knowledge_discovery_page' %}" class="{% if request.resolver_match.url_name == 'knowledge_discovery_page' %}active{% endif %}">Discover</a>
  <a href="{% url 'score_predictor_page' %}" class="{% if request.resolver_match.url_name == 'score_predictor_page' %}active{% endif %}">Predict</a>
</nav>
  </div>
</div>

<div class="page">
  {% block content %}{% endblock %}
</div>

<script>
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [], shootingStars = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.floor((w * h) / 3200);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.2 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.015 + 0.005,
      hue: Math.random() < 0.15 ? '156,140,240' : (Math.random() < 0.3 ? '228,182,103' : '226,231,245')
    }));
  }

  function maybeSpawnShootingStar() {
    if (Math.random() < 0.006 && shootingStars.length < 2) {
      shootingStars.push({ x: Math.random()*w*0.6+w*0.2, y:-20, vx:-3.2, vy:3.6, life:1, decay:0.012 });
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(s.phase + t * s.speed));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.hue}, ${twinkle})`;
      ctx.fill();
    }
    maybeSpawnShootingStar();
    shootingStars = shootingStars.filter(s => s.life > 0);
    for (const s of shootingStars) {
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx*8, s.y - s.vy*8);
      grad.addColorStop(0, `rgba(231,236,250,${s.life})`);
      grad.addColorStop(1, 'rgba(231,236,250,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx*8, s.y - s.vy*8); ctx.stroke();
      s.x += s.vx; s.y += s.vy; s.life -= s.decay;
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
</script>
{% block extra_script %}{% endblock %}
</body>
</html>
