<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}KIIT PYQ Prep{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f8f9fa;
    --border: #e5e7eb;
    --text: #111827;
    --text-soft: #6b7280;
    --green: #16a34a;
    --green-soft: #dcfce7;
    --blue-soft: #dbeafe;
    --blue-text: #1d4ed8;
    --amber-soft: #fef3c7;
    --amber-text: #92400e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-soft);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .topbar {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .topbar .brand {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .topbar .brand .accent { color: var(--green); }
  .topbar nav { display: flex; gap: 20px; flex: 1; }
  .topbar nav a {
    color: var(--text-soft);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 6px 0;
    border-bottom: 2px solid transparent;
  }
  .topbar nav a:hover { color: var(--text); }
  .topbar nav a.active { color: var(--text); border-bottom-color: var(--green); }

  .page {
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  a.plain { color: inherit; text-decoration: none; }

  .tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .tag.green { background: var(--green-soft); color: #15803d; }
  .tag.blue { background: var(--blue-soft); color: var(--blue-text); }
  .tag.amber { background: var(--amber-soft); color: var(--amber-text); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (max-width: 620px) {
    .topbar { flex-wrap: wrap; gap: 12px 20px; }
  }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <a href="{% url 'chat_page' %}" class="brand">📚 KIIT<span class="accent">PYQ</span></a>
    <nav>
      <a href="{% url 'chat_page' %}" class="{% if request.resolver_match.url_name == 'chat_page' %}active{% endif %}">Chat Assistant</a>
      <a href="{% url 'browse_subjects' %}" class="{% if 'browse' in request.resolver_match.url_name %}active{% endif %}">Browse PYQs</a>
    </nav>
  </div>

  <div class="page">
    {% block content %}{% endblock %}
  </div>

{% block extra_script %}{% endblock %}
</body>
</html>
